<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kvíz-večer ČS Dating Wien, 8. augusta 2026.">
<title>ČS Dating Kvíz · 8. 8. 2026</title>
<style>
  :root {
    --burgundy: #8b2252;
    --gold: #b8912a;
    --gold-soft: #d8b45c;
    --ink: #1a1208;
    --ivory: #f8f4ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--ivory);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif; }

  /* Buehne */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 6vh 8vw 12vh;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(139,34,82,.28), transparent 62%),
      radial-gradient(circle at 50% 100%, rgba(184,145,42,.16), transparent 60%),
      var(--ink);
  }
  .slide.active { display: flex; animation: rise .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Titel */
  .kicker {
    font-size: clamp(.8rem, 1.5vw, 1.1rem);
    letter-spacing: .42em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 2.5vh;
  }
  .title { font-size: clamp(3rem, 11vw, 9rem); line-height: .95; font-weight: 600; letter-spacing: -.01em; }
  .sub { margin-top: 3vh; font-size: clamp(1rem, 2.2vw, 1.6rem); color: rgba(248,244,238,.66); }

  /* Rundenkarte */
  .round-num {
    font-size: clamp(5rem, 20vw, 16rem); line-height: .8;
    color: transparent; -webkit-text-stroke: 2px var(--gold);
    opacity: .55; margin-bottom: 2vh;
  }

  /* Fragen */
  .meta {
    position: absolute; top: 4vh; left: 0; right: 0;
    display: flex; justify-content: center; gap: 1.2rem; align-items: center;
    font-size: clamp(.7rem, 1.3vw, .95rem);
    letter-spacing: .28em; text-transform: uppercase; color: var(--gold);
  }
  .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--burgundy); }
  .qtext {
    font-size: clamp(1.7rem, 5.2vw, 4.4rem); line-height: 1.14;
    max-width: 20ch; font-weight: 500;
  }
  .opts {
    margin-top: 4vh; display: flex; flex-wrap: wrap; gap: .7rem 1rem;
    justify-content: center; max-width: 60rem;
  }
  .opts span {
    border: 1px solid rgba(184,145,42,.42); border-radius: 999px;
    padding: .55rem 1.4rem; font-size: clamp(.85rem, 1.7vw, 1.25rem);
    color: rgba(248,244,238,.85);
  }

  /* Moderator-Hinweis, wenn kein Bild da ist */
  .clue {
    margin-top: 3.5vh; max-width: 26ch;
    font-size: clamp(1.1rem, 2.6vw, 2rem); line-height: 1.3;
    color: rgba(248,244,238,.9);
  }

  /* Antwort */
  .answer {
    margin-top: 5vh; min-height: 1.2em; max-width: 24ch;
    font-size: clamp(1.5rem, 4.4vw, 3.6rem);
    color: var(--gold-soft); font-weight: 600;
    opacity: 0; transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .revealed .answer { opacity: 1; transform: none; }
  .answer::before { content: "→ "; color: var(--burgundy); }

  /* Portraets */
  .face-box {
    height: min(46vh, 44vw); border-radius: 1.4rem; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.5); border: 1px solid rgba(184,145,42,.35);
  }
  .face-box img { height: 100%; width: auto; display: block; }
  .credit {
    position: absolute; bottom: 7vh; left: 0; right: 0;
    font-size: .68rem; color: rgba(248,244,238,.3); letter-spacing: .04em;
  }

  /* Zusatzzeile unter der Antwort: EN-Titel, Kontext */
  .note {
    margin-top: 1.2vh; font-size: clamp(.85rem, 1.6vw, 1.15rem);
    color: rgba(248,244,238,.55); letter-spacing: .02em;
    opacity: 0; transition: opacity .35s ease .1s;
  }
  .revealed .note { opacity: 1; }

  /* Logos */
  .logo-box {
    width: min(52vw, 46vh); height: min(52vw, 46vh);
    background: var(--ivory); border-radius: 2.2rem;
    display: flex; align-items: center; justify-content: center;
    padding: 3.5rem; box-shadow: 0 24px 70px rgba(0,0,0,.45);
  }
  .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* Fehlendes Bild */
  .missing {
    width: min(52vw, 42vh); height: min(38vw, 30vh);
    border: 2px dashed rgba(184,145,42,.5); border-radius: 1.6rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .8rem; color: rgba(248,244,238,.45); padding: 2rem;
  }
  .missing strong { color: var(--gold); font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; }
  .missing small { font-size: .9rem; max-width: 28ch; line-height: 1.5; }

  /* Spiele */
  .game { text-align: left; max-width: 68rem; width: 100%; }
  .game h2 { font-size: clamp(2rem, 5.5vw, 4rem); font-weight: 600; line-height: 1.05; }
  .game .gsub { color: var(--gold); margin-top: .6rem; font-size: clamp(.95rem, 1.8vw, 1.3rem); }
  .game-cols { display: grid; grid-template-columns: 1.1fr .9fr; gap: 2.4rem; margin-top: 4vh; }
  @media (max-width: 900px) { .game-cols { grid-template-columns: 1fr; } }
  .game h3 {
    font-size: .8rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--burgundy); margin-bottom: 1rem;
  }
  .game h3.gold { color: var(--gold); }
  .game ol, .game ul { padding-left: 1.3rem; }
  .game li { font-size: clamp(.95rem, 1.7vw, 1.25rem); line-height: 1.6; margin-bottom: .6rem; color: rgba(248,244,238,.88); }
  .game .why {
    margin-top: 3vh; border-left: 3px solid var(--burgundy); padding-left: 1.2rem;
    font-style: italic; color: rgba(248,244,238,.6); font-size: clamp(.9rem, 1.6vw, 1.15rem);
  }
  .gicon { font-size: clamp(2rem, 5vw, 3.4rem); }

  /* Gruender */
  .hosts { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; max-width: 62rem; margin-top: 4vh; }
  @media (max-width: 820px) { .hosts { grid-template-columns: 1fr; gap: 2rem; } }
  .host img {
    width: min(15vh, 40vw); height: min(15vh, 40vw); object-fit: cover;
    border-radius: 50%; border: 2px solid rgba(184,145,42,.5); margin-bottom: 1.4rem;
  }
  .host .hname { font-size: clamp(1.3rem, 2.6vw, 2rem); font-weight: 600; }
  .host .hrole {
    font-size: .78rem; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold); margin: .6rem 0 1rem;
  }
  .host .hbio {
    font-size: clamp(.9rem, 1.6vw, 1.15rem); line-height: 1.6;
    color: rgba(248,244,238,.75); max-width: 30ch; margin: 0 auto;
  }

  /* Werbeblock Edícia II */
  .promo { max-width: 58rem; width: 100%; }
  .promo .lead { font-size: clamp(1rem, 2vw, 1.4rem); color: rgba(248,244,238,.75); margin-top: 2vh; }
  .promo .rows { margin-top: 4vh; text-align: left; }
  .promo .prow {
    display: grid; grid-template-columns: 8rem 1fr; gap: 1.2rem;
    padding: .8rem 0; border-top: 1px solid rgba(248,244,238,.1);
  }
  @media (max-width: 700px) { .promo .prow { grid-template-columns: 1fr; gap: .2rem; } }
  .promo .plabel {
    font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); padding-top: .35rem;
  }
  .promo .pval { font-size: clamp(.95rem, 1.7vw, 1.2rem); color: rgba(248,244,238,.9); }
  .promo .pricebox {
    margin-top: 4vh; display: flex; gap: 1.6rem; align-items: center;
    justify-content: center; flex-wrap: wrap;
  }
  .promo .old { font-size: clamp(1.4rem, 3vw, 2.2rem); color: rgba(248,244,238,.4); text-decoration: line-through; }
  .promo .new { font-size: clamp(2.6rem, 7vw, 5rem); color: var(--gold-soft); font-weight: 700; line-height: 1; }
  .promo .code {
    border: 1px solid var(--gold); border-radius: 999px; padding: .6rem 1.5rem;
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--gold);
  }
  .promo .code em { display: block; font-style: normal; font-size: .7rem; opacity: .7; letter-spacing: .06em; }
  .promo .pfoot { margin-top: 3vh; font-size: clamp(.85rem, 1.5vw, 1.05rem); color: rgba(248,244,238,.55); }
  .promo .purl {
    margin-top: 2.5vh; font-size: clamp(1.2rem, 2.6vw, 1.9rem);
    color: var(--ivory); letter-spacing: .06em;
  }

  /* Antworttafel am Rundenende */
  .sheet { width: 100%; max-width: 62rem; text-align: left; }
  .sheet h2 {
    font-size: clamp(1.4rem, 3.2vw, 2.4rem); font-weight: 600; margin-bottom: 3vh;
    color: var(--gold-soft);
  }
  .sheet .row {
    display: grid; grid-template-columns: 2.2rem 1fr 1fr; gap: 1rem;
    padding: .85rem 0; border-top: 1px solid rgba(248,244,238,.1);
    align-items: baseline;
  }
  @media (max-width: 760px) { .sheet .row { grid-template-columns: 2rem 1fr; } }
  .sheet .num { color: var(--burgundy); font-weight: 700; }
  .sheet .qq { color: rgba(248,244,238,.62); font-size: clamp(.85rem, 1.5vw, 1.05rem); }
  .sheet .aa {
    color: var(--gold-soft); font-weight: 600;
    font-size: clamp(1rem, 2vw, 1.45rem);
  }

  /* Modus-Waehler auf der Titelfolie */
  .modes { margin-top: 5vh; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  .modes button {
    font: inherit; font-size: clamp(.85rem, 1.6vw, 1.05rem);
    background: transparent; color: var(--ivory);
    border: 1px solid rgba(184,145,42,.5); border-radius: 999px;
    padding: .8rem 1.8rem; cursor: pointer; transition: background .2s, border-color .2s;
  }
  .modes button:hover { background: rgba(184,145,42,.14); }
  .modes button.on { background: var(--burgundy); border-color: var(--burgundy); }
  .modes small { display: block; opacity: .6; font-size: .78rem; margin-top: .3rem; }

  /* Fusszeile */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 4px;
    background: rgba(248,244,238,.08);
  }
  #bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--burgundy), var(--gold)); transition: width .3s ease; }
  #hint {
    position: fixed; bottom: 2.2vh; left: 0; right: 0; text-align: center;
    font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(248,244,238,.28); pointer-events: none;
  }
  #counter {
    position: fixed; bottom: 2vh; right: 2.4vw;
    font-size: .8rem; color: rgba(248,244,238,.35); letter-spacing: .12em;
  }

  /* Uebersicht */
  #help {
    position: fixed; inset: 0; background: rgba(10,7,4,.94);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #help.on { display: flex; }
  #help div { max-width: 34rem; line-height: 2; font-size: 1rem; }
  #help kbd {
    background: rgba(184,145,42,.16); border: 1px solid rgba(184,145,42,.4);
    border-radius: .35rem; padding: .15rem .55rem; margin-right: .7rem;
    font-family: ui-monospace, Menlo, monospace; font-size: .85rem; color: var(--gold);
  }
</style>
</head>

const stage = document.getElementById('stage');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function meta(round, n) {
  return `<div class="meta"><span>${esc(round)}</span><span class="dot"></span><span>otázka ${n}</span></div>`;
}

// Zusatzzeile unter der Antwort, erscheint mit ihr zusammen. Leer, wenn nichts da ist.
function note(s) {
  return s.note ? `<div class="note">${esc(s.note)}</div>` : '';
}

function render(s) {
  switch (s.type) {
    case 'title':
      return `<div class="kicker">${esc(s.kicker)}</div>
              <h1 class="title display">${esc(s.title)}</h1>
              <div class="sub">${esc(s.sub)}</div>` +
             (s.picker ? `<div class="modes">
                <button data-mode="inline">Odpoveď hneď<small>po každej otázke</small></button>
                <button data-mode="end">Odpovede na konci kola<small>klasický pub kvíz</small></button>
              </div>` : '');
    case 'hosts':
      return `<div class="kicker">${esc(s.kicker)}</div>
              <h1 class="title display" style="font-size:clamp(2.2rem,6vw,4.5rem)">${esc(s.title)}</h1>
              <div class="hosts">${s.people.map(p => `<div class="host">
                  <img src="${p.img}" alt="">
                  <div class="hname display">${esc(p.name)}</div>
                  <div class="hrole">${esc(p.role)}</div>
                  <div class="hbio">${esc(p.bio)}</div>
                </div>`).join('')}</div>`;
    case 'promo':
      return `<div class="promo">
                <div class="kicker">${esc(s.kicker)}</div>
                <h1 class="title display" style="font-size:clamp(2.6rem,8vw,6rem)">${esc(s.title)}</h1>
                <div class="lead">${esc(s.lead)}</div>
                <div class="rows">${s.rows.map(([l, v]) => `<div class="prow">
                    <div class="plabel">${esc(l)}</div><div class="pval">${esc(v)}</div>
                  </div>`).join('')}</div>
                <div class="pricebox">
                  <span class="old">${esc(s.price_old)}</span>
                  <span class="new display">${esc(s.price_new)}</span>
                  <span class="code">${esc(s.code)}<em>${esc(s.code_note)}</em></span>
                </div>
                <div class="pfoot">${esc(s.foot)}</div>
                <div class="purl display">${esc(s.url)}</div>
              </div>`;
    case 'answers':
      return `<div class="sheet">
                <h2 class="display">Odpovede &mdash; ${esc(s.round)}</h2>
                ${s.items.map(([n, q, a]) => `<div class="row">
                    <div class="num">${n}</div>
                    <div class="qq">${esc(q)}</div>
                    <div class="aa display">${esc(a)}</div>
                  </div>`).join('')}
              </div>`;
    case 'round':
      return `<div class="round-num display">${s.n}</div>
              <div class="kicker">kolo ${s.n}</div>
              <h1 class="title display" style="font-size:clamp(2.4rem,7vw,6rem)">${esc(s.title)}</h1>
              <div class="sub">${esc(s.sub)}</div>`;
    case 'q':
      return meta(s.round, s.n) +
             `<div class="qtext display">${esc(s.q)}</div>` +
             (s.opts ? `<div class="opts">${s.opts.map(o=>`<span>${esc(o)}</span>`).join('')}</div>` : '') +
             `<div class="answer display">${esc(s.a)}</div>` + note(s);
    case 'logo':
      return meta(s.round, s.n) +
             `<div class="logo-box"><img src="${s.img}" alt=""></div>
              <div class="answer display">${esc(s.a)}</div>` + note(s);
    case 'face':
      return meta(s.round, s.n) +
             `<div class="face-box"><img src="${s.img}" alt=""></div>
              <div class="answer display">${esc(s.a)}</div>` + note(s) +
             `<div class="credit">${esc(s.credit)}</div>`;
    case 'pic':
      return meta(s.round, s.n) +
             `<div class="missing">
                <strong>obrázok sem</strong>
                <small>V prezentácii je pri tejto otázke iba odpoveď, obrázok nie.
                       Doplň obrázok, alebo prečítaj nápovedu nižšie.</small>
              </div>
              <div class="clue display">${esc(s.clue)}</div>
              <div class="answer display">${esc(s.a)}</div>` + note(s);
    case 'game':
      return `<div class="game">
                <div class="gicon">${s.icon}</div>
                <h2 class="display">${esc(s.title)}</h2>
                <div class="gsub">${esc(s.sub)}</div>
                <div class="game-cols">
                  <div><h3>Ako na to</h3><ol>${s.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ol></div>
                  <div><h3 class="gold">Príklady</h3><ul>${s.ex.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
                </div>
                <div class="why">${esc(s.why)}</div>
              </div>`;
  }
  return '';
}

DECK.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.dataset.i = i;
  el.innerHTML = render(s);
  stage.appendChild(el);
});

const slides = [...document.querySelectorAll('.slide')];
const isQ = i => ['q','logo','pic','face'].includes(DECK[i].type);

// Dva rezimy. 'inline' = odpoved sa odhali hned pri otazke (povodne spravanie).
// 'end'    = odpovede sa neodhaluju, namiesto toho bezi na konci kola suhrnna tabulka.
let mode = localStorage.getItem('kvizMode') || 'end';
let visible = [], pos = 0;

function rebuild(keepSlide) {
  visible = DECK.map((s, i) => i).filter(i =>
    mode === 'end' ? true : DECK[i].type !== 'answers');
  const want = visible.indexOf(keepSlide);
  pos = want >= 0 ? want : 0;
  document.getElementById('mode-label').textContent =
    mode === 'end' ? 'odpovede na konci kola' : 'odpoveď hneď';
  document.querySelectorAll('.modes button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  show(pos);
}

function show(p) {
  pos = Math.max(0, Math.min(visible.length - 1, p));
  const active = visible[pos];
  slides.forEach((el, k) => el.classList.toggle('active', k === active));
  document.querySelector('#bar div').style.width = ((pos + 1) / visible.length * 100) + '%';
  document.getElementById('counter').textContent = (pos + 1) + ' / ' + visible.length;
}

// V rezime 'end' sa odpoved pri otazke neodhaluje vobec.
function reveal() {
  const i = visible[pos];
  if (mode === 'inline' && isQ(i)) slides[i].classList.add('revealed');
}

function forward() {
  const i = visible[pos];
  if (mode === 'inline' && isQ(i) && !slides[i].classList.contains('revealed')) { reveal(); return; }
  show(pos + 1);
}

function setMode(m) {
  const keep = visible[pos];
  mode = m;
  localStorage.setItem('kvizMode', m);
  slides.forEach(el => el.classList.remove('revealed'));
  rebuild(keep);
}

document.addEventListener('keydown', e => {
  const help = document.getElementById('help');
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); forward(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); show(pos - 1); break;
    case 'Enter': e.preventDefault(); reveal(); break;
    case 'Home': show(0); break;
    case 'End': show(visible.length - 1); break;
    case 'f': case 'F':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      break;
    case 'h': case 'H': help.classList.toggle('on'); break;
    case 'o': case 'O': setMode(mode === 'end' ? 'inline' : 'end'); break;
    case 'Escape': help.classList.remove('on'); break;
  }
});

// Klepnutie: pravá tretina ďalej, ľavá späť. Pre tablet na stole.
document.addEventListener('click', e => {
  if (e.target.closest('#help')) { document.getElementById('help').classList.remove('on'); return; }
  const btn = e.target.closest('.modes button');
  if (btn) { setMode(btn.dataset.mode); return; }
  if (e.clientX < window.innerWidth * 0.25) show(pos - 1); else forward();
});

// Skok priamo na snímok cez adresu, napr. ...html#12
const start = parseInt((location.hash || '').replace('#', ''), 10);
rebuild(0);
if (Number.isFinite(start)) show(start - 1);
</script>
